<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>HiraishinMail</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23FFD700'/%3E%3Cstop offset='100%25' style='stop-color:%23F59E0B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='46' font-family='Inter,sans-serif' font-size='36' font-weight='700' fill='%231E3A5F' text-anchor='middle'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <button id="menuBtn" class="icon-btn" title="Menu" aria-label="Menu">
        <span class="material-icons-outlined">menu</span>
      </button>
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 64 64" width="32" height="32">
          <defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#FFD700"/><stop offset="100%" style="stop-color:#F59E0B"/></linearGradient></defs>
          <rect width="64" height="64" rx="14" fill="url(#lg)"/>
          <text x="32" y="44" font-family="Roboto,sans-serif" font-size="32" font-weight="700" fill="#1a1a2e" text-anchor="middle">H</text>
        </svg>
        <span class="logo-text">HiraishinMail</span>
      </div>
    </div>
    <!-- Search bar removed (not implemented); keep the div for header flex spacing -->
    <div class="header-center"></div>
    <div class="header-right">
      <span id="currentInboxLabel" class="inbox-badge">No inbox</span>
    </div>
  </header>

  <div class="main-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <button id="composeBtn" class="compose-btn">
        <span class="material-icons-outlined">edit</span>
        <span>New Inbox</span>
      </button>
      <nav class="sidebar-nav">
        <div class="nav-item active">
          <span class="material-icons-outlined">inbox</span>
          <span class="nav-label">Inboxes</span>
          <select id="inboxSelect" class="inbox-select" aria-label="Select inbox"></select>
        </div>
      </nav>
      <div class="sidebar-actions">
        <button id="copyBtn" class="sidebar-btn" title="Copy email address">
          <span class="material-icons-outlined">content_copy</span>
          <span>Copy Address</span>
        </button>
        <button id="deleteBtn" class="sidebar-btn danger" title="Delete inbox">
          <span class="material-icons-outlined">delete</span>
          <span>Delete</span>
        </button>
      </div>
      <div class="sidebar-footer">
        <a href="https://github.com/ardiannurcahya" target="_blank" rel="noopener">
          Developed by <strong>Ardian Nurcahya</strong>
        </a>
      </div>
    </aside>

    <!-- Main content -->
    <main class="content">
      <!-- Compose dialog -->
      <div class="compose-dialog hidden" id="composeDialog" role="dialog" aria-modal="true" aria-labelledby="composeDialogTitle">
        <div class="compose-header">
          <h3 id="composeDialogTitle">New Inbox</h3>
          <button id="closeComposeBtn" class="icon-btn" title="Close" aria-label="Close">
            <span class="material-icons-outlined">close</span>
          </button>
        </div>
        <div class="compose-body">
          <div class="compose-field">
            <label for="localPartInput">Username</label>
            <input id="localPartInput" type="text" placeholder="custom name or leave empty for random" autocomplete="off" />
          </div>
          <div class="compose-field">
            <label for="domainSelect">Domain</label>
            <select id="domainSelect"></select>
          </div>
          <div class="compose-actions">
            <button id="createRandomBtn" class="btn btn-secondary">
              <span class="material-icons-outlined">casino</span>
              Random
            </button>
            <button id="createCustomBtn" class="btn btn-primary">
              <span class="material-icons-outlined">add</span>
              Create
            </button>
          </div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="content-toolbar">
        <label class="checkbox-wrapper" title="Select all">
          <input type="checkbox" id="selectAll" disabled aria-label="Select all messages" />
          <span class="checkmark"></span>
        </label>
        <button id="refreshBtn" class="icon-btn" title="Refresh" aria-label="Refresh">
          <span class="material-icons-outlined">refresh</span>
        </button>
        <span id="messageCount" class="msg-count">0 messages</span>
      </div>

      <!-- Message list -->
      <div id="messageList" class="message-list"></div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/app.js"></script>
</body>
</html>
